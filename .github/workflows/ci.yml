name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx firebase emulators:exec --only firestore --project demo-yutori-ops "node --test tests/security-emulator.mjs"

      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --only auth,firestore --project demo-yutori-ops "npx playwright test"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_READY == 'true'
    needs: verify
    uses: ./.github/workflows/deploy.yml
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
